<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="theme-color" content="#2b1b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Peds Endo Clinic</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=6">
<link rel="apple-touch-icon" href="icon-192.png?v=6">
<style>
@font-face{font-family:'Fraunces';src:url(fraunces-latin-full-normal.woff2) format('woff2');font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url(fraunces-latin-full-italic.woff2) format('woff2');font-weight:100 900;font-style:italic;font-display:swap}
@font-face{font-family:'Manrope';src:url(manrope-latin-wght-normal.woff2) format('woff2');font-weight:200 800;font-style:normal;font-display:swap}
:root{
  --ink:#2b1b3d; --ink2:#594c6b; --muted:#756986;
  --line:rgba(43,27,61,.11); --line-strong:rgba(43,27,61,.20);
  --paper:#faf7f2; --card:#ffffff; --lav:#efe8f8; --lav2:#dfd2f0;
  --marigold:#e2a32b; --marigold-d:#9a6708; --teal:#1f7a74; --rose:#c2456b; --brick:#c2410c; --leaf:#2d6a4f;
  --r-lg:20px; --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(43,27,61,.05),0 4px 14px -4px rgba(43,27,61,.07);
  --ease:cubic-bezier(0.22,1,0.36,1);
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased}
html[data-size="large"]{font-size:20px}
html[data-size="xlarge"]{font-size:22px}
body{min-height:100vh;min-height:100dvh;background:var(--paper)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num,.tile .v,.tile .s,.live b,.vrow .d,.vrow .m,.chip,.stats{font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(112px + env(safe-area-inset-bottom))}
#app:has(.login){padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 0 8px;gap:12px}
.top .logo{height:44px}
.iconbtn{width:56px;height:56px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none;transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.iconbtn:active{transform:scale(.97);background:var(--lav)}
.iconbtn svg{width:22px;height:22px}
.ttl{font-family:var(--sans);font-weight:600;font-size:1.1rem;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* bottom navigation */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--card);border-top:1px solid var(--line);padding:4px 8px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(43,27,61,.05)}
.bnav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.bnav button{min-height:56px;border:0;border-radius:var(--r-sm);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;padding:4px 2px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.bnav button svg{width:22px;height:22px}
.bnav button.on{background:var(--lav);color:var(--ink)}
@media (max-width:370px){.bnav button{font-size:11px}}

/* update banner */
.update-bar{margin:8px 0 4px;padding:12px 16px;border-radius:var(--r);background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:600;cursor:pointer;border:0;width:100%;text-align:left;min-height:56px}
.update-bar span.pill{background:var(--marigold);color:var(--ink);padding:4px 10px;border-radius:var(--r-sm);font-size:13px;font-weight:700;white-space:nowrap}

/* home */
.hello{padding:16px 0 20px}
.hello .date{font-size:14px;font-weight:600;color:var(--marigold-d)}
.hello h1{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.08;margin:4px 0 8px;letter-spacing:-.02em;font-variation-settings:"opsz" 72}
.hello .stats{color:var(--ink2);font-size:16px;font-weight:500}
.search{position:relative;margin:0 0 12px}
.search input{width:100%;height:56px;border-radius:var(--r);border:1.5px solid var(--line-strong);background:var(--card);padding:0 16px 0 48px;font-size:18px;box-shadow:var(--shadow);outline:none;transition:border-color .15s var(--ease)}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:16px;top:17px;width:22px;height:22px;color:var(--muted)}
.cta{width:100%;height:60px;border:0;border-radius:var(--r);background:var(--ink);color:#fff;font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:var(--shadow);cursor:pointer;transition:background-color .15s var(--ease),transform .15s var(--ease)}
.cta:active{transform:scale(.985)}
.cta.gold{background:var(--marigold);color:var(--ink)}
.cta .plus{width:28px;height:28px;border-radius:var(--r-sm);background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px;font-weight:500;line-height:1}
.cta.gold .plus{background:rgba(43,27,61,.12)}
.sec-title{font-family:var(--sans);font-size:18px;font-weight:600;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline;color:var(--ink)}
.sec-title small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:500}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pcard{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 16px;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line);transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.pcard:active{transform:scale(.985);border-color:var(--line-strong);background:var(--lav)}
.pebble{width:48px;height:52px;flex:none;border-radius:52% 48% 46% 54% / 58% 56% 44% 42%;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:.02em;transform:rotate(-6deg);color:#fff}
.pebble span{transform:rotate(6deg)}
.pebble.M{background:var(--teal)}
.pebble.F{background:var(--rose)}
.pcard .nm{font-family:var(--sans);font-size:18px;font-weight:600;line-height:1.25}
.pcard .sub{color:var(--ink2);font-size:14px;margin-top:2px}
.pcard .grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-sm);padding:4px 8px;font-size:13px;font-weight:600;background:var(--lav);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.chip.warn{background:#fdece6;color:var(--brick);border-color:rgba(184,59,20,.2)} .chip.ok{background:#e6f3ec;color:#1e5c3e;border-color:rgba(30,92,62,.18)} .chip.gold{background:#fbf0d9;color:#7a5004;border-color:rgba(154,103,8,.2)}
.empty{text-align:center;color:var(--ink2);padding:32px 16px;background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow)}
.empty .big{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--ink);margin-bottom:4px}

/* patient */
.hero{background:var(--ink);color:#fff;border-radius:var(--r-lg);padding:20px;position:relative;box-shadow:var(--shadow)}
.hero .nm{font-family:var(--serif);font-size:32px;font-weight:500;line-height:1.1;letter-spacing:-.01em}
.hero .meta{color:rgba(255,255,255,.82);margin-top:8px;font-size:15px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero .chip{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.16)}
.hero .chip.gold{background:var(--marigold);color:var(--ink);border-color:transparent}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.btn{height:56px;border-radius:var(--r);border:1.5px solid var(--line-strong);background:var(--card);font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow);transition:background-color .15s var(--ease),border-color .15s var(--ease),transform .15s var(--ease)}
.btn:active{transform:scale(.985);background:var(--lav)}
.btn svg{width:20px;height:20px;color:var(--ink2)}
.btn.danger{color:var(--brick);border-color:rgba(184,59,20,.28)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .k{font-size:13px;font-weight:600;color:var(--muted)}
.tile .v{font-family:var(--serif);font-size:28px;font-weight:500;margin-top:4px;line-height:1.1}
.tile .v small{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink2)}
.tile .s{margin-top:8px;font-weight:600;font-size:14px;color:var(--ink2)}
.tile .s .c{color:var(--muted);font-weight:500}
.tile.alert{border-color:rgba(184,59,20,.35);background:#fffaf8}
.tile.alert .s{color:var(--brick)}
.tile .bar{display:none}
.tile.alert .bar{display:block;position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brick)}
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px}
.seg{display:flex;background:var(--lav);border-radius:var(--r);padding:4px;gap:4px}
.seg button{flex:1;height:44px;border:0;border-radius:var(--r-sm);background:transparent;font-weight:600;font-size:15px;color:var(--ink2);cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(43,27,61,.08)}
.chartbox{margin-top:12px}
.chartbox svg{width:100%;height:auto;display:block}
.charttools{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink2);font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:0}
.link{border:0;background:none;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px;cursor:pointer;padding:8px 0}
.vlist{list-style:none;margin:0;padding:0}
.vrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background-color .15s var(--ease)}
.vrow:last-child{border-bottom:0}
.vrow .d{font-family:var(--sans);font-weight:600;font-size:16px;line-height:1.2;text-align:center;min-width:56px}
.vrow .d small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.vrow .m{font-size:15px;color:var(--ink2)} .vrow .m b{color:var(--ink);font-weight:600}

/* forms */
.form{display:grid;gap:16px;margin-top:8px}
.field label,.flabel{display:block;font-weight:600;font-size:15px;margin:0 0 8px 2px;color:var(--ink2)}
.field input,.field textarea{width:100%;min-height:56px;border-radius:var(--r);border:1.5px solid var(--line-strong);background:var(--card);padding:12px 16px;font-size:18px;outline:none;transition:border-color .15s var(--ease)}
.field textarea{min-height:96px;font-size:17px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.unit{position:relative}.unit input{padding-right:56px}.unit span{position:absolute;right:16px;top:16px;font-weight:600;font-size:15px;color:var(--muted)}
.big input{font-family:var(--serif);font-size:28px;font-weight:500;min-height:72px}
.big .unit span{top:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dob{display:grid;grid-template-columns:1fr 1fr 1.5fr auto;gap:8px;align-items:center}
.dob input{text-align:center;font-variant-numeric:tabular-nums}
.today{height:56px;padding:0 16px;border-radius:var(--r);border:1.5px solid var(--line-strong);background:var(--lav);font-weight:600;font-size:15px;cursor:pointer}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle button{height:64px;border-radius:var(--r);border:1.5px solid var(--line-strong);background:var(--card);font-weight:600;font-size:18px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.toggle button .pebble{width:28px;height:28px;border-radius:var(--r-sm);font-size:13px}
.toggle button.on.M{border-color:var(--teal);background:#e5f3f1;color:#155854}
.toggle button.on.F{border-color:var(--rose);background:#fae8ee;color:#9b2c50}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{min-height:48px;padding:0 16px;border-radius:var(--r);border:1.5px solid var(--line-strong);background:var(--card);font-weight:600;font-size:15px;cursor:pointer;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.choices button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
details.more{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:0 16px}
details.more summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:600;font-size:17px;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary:after{content:"+";font-size:24px;color:var(--muted);font-weight:400}
details.more[open] summary:after{content:"–"}
details.more .form{padding-bottom:16px;margin-top:0}
details.more .hint{font-size:14px;color:var(--muted);margin:-4px 0 12px}
.live{background:var(--lav);border-radius:var(--r);border:1px solid var(--line);padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.live div{font-size:13px;font-weight:600;color:var(--ink2)}
.live b{display:block;font-family:var(--serif);font-size:24px;color:var(--ink);font-weight:500;margin-top:2px}
.live b small{font-family:var(--sans);font-size:13px;color:var(--ink2);font-weight:600}
.stickybar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 75%,rgba(250,247,242,0));z-index:5}
.stickybar .inner{max-width:640px;margin:0 auto;display:flex;gap:12px}
.stickybar .cta{flex:1}
.err{color:var(--brick);font-weight:600;font-size:15px;margin:4px 0 0}

/* sync pill, toast, modal */
.syncpill{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px auto 0;font-size:14px;color:var(--ink2);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;background:#2e8b57}
.dot.wait{background:var(--marigold)}.dot.off{background:#9b92a8}.dot.bad{background:var(--brick)}
.demo{background:#fbf0d9;color:#6d4a05;border:1px solid rgba(154,103,8,.2);border-radius:var(--r);padding:12px 16px;font-size:14px;font-weight:500;margin-top:12px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:#fff;border-radius:var(--r);padding:12px 20px;font-weight:600;font-size:15px;transition:transform .22s var(--ease),opacity .22s var(--ease);z-index:20;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(43,27,61,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.modal .sheet-in{background:var(--paper);width:100%;max-width:640px;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
.modal h3{font-family:var(--serif);font-size:24px;margin:0 0 8px;font-weight:500}
.modal p{color:var(--ink2);margin:0 0 16px}
.modal .col{display:grid;gap:12px}
.login{min-height:calc(100dvh - 48px);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px 0}
.login .logo{width:192px;margin:0 auto 4px}
.login h1{font-family:var(--serif);text-align:center;font-weight:500;font-size:32px;line-height:1.1;margin:0;letter-spacing:-.01em}
.login .sub{text-align:center;color:var(--ink2);font-size:15px;margin:-8px 0 4px}
.settings .row{display:flex;align-items:center;gap:12px;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}
.settings .row:last-child{border-bottom:0}
.settings .row .ic{width:40px;height:40px;border-radius:var(--r-sm);background:var(--lav);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--ink2)}
.settings .row .ic svg{width:20px;height:20px}
.settings .row small{display:block;color:var(--muted);font-weight:500;font-size:14px}
.fineprint{font-size:13px;color:var(--muted);margin-top:20px;line-height:1.5}

/* ===================== PRINT ===================== */
#print-root{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff !important;font-size:12px}
  body > *:not(#print-root){display:none !important}
  #print-root{display:block}
}
body.printing > *:not(#print-root){display:none !important}
body.printing #print-root{display:block}
body.printing{background:#fff}
.sheet{width:210mm;height:297mm;padding:8mm 12mm 8mm;position:relative;overflow:hidden;page-break-after:always;break-after:page;background:#fff;color:#1f1430;font-family:var(--sans);font-size:10.5pt;display:flex;flex-direction:column}
.sheet:last-child{page-break-after:auto;break-after:auto}
.sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lh{display:flex;justify-content:space-between;align-items:center;padding:0 2mm}
.lh-logo{height:26mm}
.lh-doc{border-left:1.2px solid #2b1b3d;padding-left:4mm;font-size:10.5pt;line-height:1.35;color:#2b1b3d;min-width:76mm}
.lh-name{font-family:var(--serif);font-weight:700;font-size:14pt;color:#2b1b3d}
.lh-small .lh-logo{height:17mm}.lh-small .lh-doc{font-size:8.5pt}.lh-small .lh-name{font-size:11pt}
.lh-rule{border-top:1.6px dotted #7d6a99;margin:2.5mm 0 3mm}
.idblock{display:grid;grid-template-columns:1fr 52mm;gap:8mm}
.fld{display:flex;align-items:baseline;gap:2mm;min-height:7.2mm}
.fld .lab{white-space:nowrap;font-weight:500;color:#2b1b3d}
.fld .val{flex:1;border-bottom:1.2px dotted #6a568f;min-height:5mm;font-weight:700;color:#1d2a7a;padding-left:1mm;font-size:10.5pt;line-height:1.2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.row2.fm{grid-template-columns:1fr 1fr}
.sdsbar{width:100%;border-collapse:separate;border-spacing:0;margin:3mm 0 2.5mm;border:1.2px solid #b9a7d3;border-radius:2.5mm;overflow:hidden;font-size:8.5pt;text-align:center;background:#f6f1fb}
.sdsbar th{font-weight:800;color:#5a4a72;padding:1.2mm 1mm .4mm;letter-spacing:.02em;font-size:7.6pt;text-transform:uppercase}
.sdsbar td{font-weight:800;font-size:10.5pt;color:#1d2a7a;padding:.3mm 1mm 1.4mm;height:7.5mm}
.sdsbar td small{display:block;font-size:7pt;color:#c2410c}
.sec{margin-top:1mm}
.sec-h{font-weight:800;font-size:10.5pt;margin:1.5mm 0 0;color:#2b1b3d}
.wl{display:flex;align-items:flex-end;gap:2mm;min-height:7mm}
.wl .lab{white-space:nowrap;color:#2b1b3d}
.wl .wline{flex:1;border-bottom:1px solid #cfc2e2;min-height:6mm;color:#1d2a7a;font-weight:600;padding-left:1mm;line-height:1.25}
.wline.full{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:8mm}
.exam .wl{min-height:7.4mm}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding:1.5mm 2mm 1.5mm}
.nv{width:42mm;border:1.4px solid #2b1b3d;border-radius:2mm;overflow:hidden}
.nv-h{background:#2b1b3d;color:#fff;font-weight:800;text-align:center;font-size:10pt;padding:.8mm}
.nv-b{height:8mm;text-align:center;font-weight:800;color:#1d2a7a;padding-top:1.4mm}
.ft-sign{font-family:var(--serif);font-weight:700;font-size:12.5pt;color:#2b1b3d}
.ft-addr{border-top:2.4px solid #6a568f;padding-top:1.4mm;font-size:8.6pt;text-align:center;color:#2b1b3d}
.back-top{display:flex;justify-content:space-between;border-bottom:1.6px dotted #7d6a99;padding-bottom:2.5mm;font-size:10.5pt}
.inv-h{font-family:var(--serif);font-weight:700;font-size:16pt;margin:5mm 0 2mm;color:#2b1b3d}
.inv{margin:0;padding-left:7mm;display:grid;gap:0}
.inv li{padding:1.6mm 0 0;font-weight:800;font-size:11pt;color:#2b1b3d}
.inv li::marker{font-weight:800}
.inv-l{margin-bottom:1mm}
.inv .wline{display:block;border-bottom:1px solid #cfc2e2;min-height:8.5mm;font-weight:600;color:#1d2a7a;padding:1mm}
.grec{width:100%;border-collapse:collapse;font-size:8.6pt;margin-top:1.5mm;text-align:center}
.grec th{background:#efe8f8;color:#2b1b3d;font-weight:800;padding:1.2mm;border:1px solid #d8cbe9}
.grec td{border:1px solid #e2d8ee;padding:1mm;color:#1f1430}
.advice{flex:1;min-height:20mm;margin-top:1mm;background-image:linear-gradient(to bottom,transparent 7.2mm,#cfc2e2 7.2mm);background-size:100% 7.5mm;color:#1d2a7a;font-weight:600;white-space:pre-wrap;line-height:7.5mm}
.chartpage .cp-title{font-family:var(--serif);font-weight:700;font-size:15pt;margin:0 0 1.5mm;color:#2b1b3d}
.cp-strip{display:flex;justify-content:space-between;gap:4mm;font-size:9pt;background:#f6f1fb;border-radius:2mm;padding:1.6mm 3mm;margin-bottom:2mm;flex-wrap:wrap}
.cp-chart svg{width:100%;height:auto;display:block}
.cp-legend{display:flex;gap:5mm;font-size:8.5pt;margin-top:1.5mm;flex-wrap:wrap;color:#2b1b3d}
.cp-legend i{display:inline-block;width:3mm;height:3mm;margin-right:1.2mm;vertical-align:-.3mm;border-radius:50%}
.lg-h{background:#c2410c}.lg-w{background:#0f6b66;border-radius:0 !important}.lg-ba{border:1.5px solid #1e3a8a;background:#fff}.lg-mph{background:#a16207;transform:rotate(45deg);border-radius:0 !important}
.lg-ov{background:#ea7a0c;height:1mm !important;border-radius:0 !important;vertical-align:.6mm !important;width:6mm !important}.lg-ob{background:#c81e1e;height:1mm !important;border-radius:0 !important;vertical-align:.6mm !important;width:6mm !important}
.cp-src{font-size:7.5pt;color:#6a568f;margin-top:1mm}
